[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llms4subjects"
version = "0.1.0"
description = "Retrieval-based GND subject tagging for TIBKAT records"
requires-python = ">=3.12"
# Dependencies are pinned per host in requirements/: mac.txt (CUDA-free, the
# local loop) and gpu.txt (the three training runs). They are deliberately not
# duplicated here, because the two hosts differ only in the torch build.
dependencies = []

[tool.setuptools]
packages = ["llms4subjects", "llms4subjects.stages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
