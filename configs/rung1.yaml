# Rung 1 of the experiment ladder (docs/spec.md, "The experiment ladder"):
# 8,000 documents stratified by record type and language, off-the-shelf
# encoders, Apple Silicon. Swap `encoder.name` to screen each of the four.
name: rung1-e5-base

encoder:
  name: intfloat/multilingual-e5-base
  max_length: 512
  batch_size: 32

index:
  corpora: [core_train]
  size: 8000
  stratify: true
  seed: 42

label_text:
  qualifiers: parenthetical
  include_definition: false
  bilingual: true

retrievers:
  knn:
    enabled: true
    neighbours: 20
    top_k: 100
    weight: 1.0
  dense:
    enabled: true
    top_k: 100
    weight: 1.0
  lexical:
    enabled: true
    top_k: 100
    weight: 1.0

fusion:
  candidates: 100
  rrf_k: 60

notes: >
  Screening rung. Reranking, group prior and adjudication stay off so that
  retriever recall is measured on its own.
