# `bge-m3` at the rung-3 index, off the shelf (ticket 15).
#
# One line apart from configs/rung3.yaml — the adapter — and one index section apart
# from the encoder's rung-2 file. That is what makes three rows separable:
# this file against rung 2 is index size, and this file against
# configs/rung3.yaml is the fine-tune.
name: rung3-bge-m3

encoder:
  name: BAAI/bge-m3
  max_length: 512
  batch_size: 32

index:
  # `all_train` already contains every `core_train` record plus 38,545 more, so
  # naming both would index each core record twice. 70,588 documents, of which
  # 70,579 are indexed: nine are `core_dev` records that the all-subjects split
  # carries and reference/split_alignment.json names.
  corpora: [all_train]
  size: null
  stratify: false
  seed: 42

label_text:
  qualifiers: parenthetical
  include_definition: false
  bilingual: true

retrievers:
  knn:
    enabled: true
    neighbours: 20
    top_k: 100
    # Still the weights tuned for `multilingual-e5-base` at rung 1. Rung 2 read
    # 0.5337 as a floor for that reason and called retuning rung 3's first
    # step; it is deliberately not taken here, because a retune inside this
    # comparison would be reported as what fine-tuning bought. It belongs to a
    # config of its own, against these rows.
    weight: 1.5
  dense:
    enabled: true
    top_k: 100
    weight: 1.0
  lexical:
    enabled: true
    top_k: 100
    weight: 1.0

fusion:
  candidates: 100
  rrf_k: 60

# The reranker, group prior and adjudicator stay off here. Each is turned on by
# its own ticket, in a config of its own, once its contribution and its
# parameters are measured rather than guessed — naming a model or a weight in
# this file before then would read as a decision that had been made.

notes: >
  Rung 3, `bge-m3` off the shelf. The control on the fine-tune:
  same index, same fusion, same label text, untrained weights. It is not
  a spare row — rung 2 measured a fourfold index at +0.06 on its own, so
  a fine-tuned score read against rung 2 would credit the training with
  whatever the extra 38,545 documents bought.
